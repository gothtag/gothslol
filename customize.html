<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GothSlol - Personnaliser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Onest', sans-serif;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* SIDEBAR NAVIGATION - GUNS.LOL STYLE */
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 20, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            text-decoration: none;
            color: #fff;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(124, 58, 237, 0.2);
            color: #c4b5fd;
        }

        .nav-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .main-content {
            margin-left: 280px;
            width: calc(100% - 280px);
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .settings-panel {
            flex: 1;
            min-width: 280px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
        }

        .preview-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .preview-title {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .preview-frame {
            width: 100%;
            background: rgba(20, 20, 20, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            max-height: 80vh;
            overflow-y: auto;
        }

        .preview-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: 0;
        }

        .preview-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .preview-logo {
            font-size: 48px;
            opacity: 0.9;
        }

        .preview-name {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        .preview-bio {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c4b5fd;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .color-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .color-input-group {
            flex: 1;
        }

        .color-input-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .color-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-picker {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .color-hex {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #c4b5fd;
            margin-bottom: 15px;
            margin-top: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(196, 181, 253, 0.2);
        }

        .profile-item,
        .social-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .profile-item label,
        .social-item label {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
            font-weight: 600;
        }

        .profile-item input,
        .social-item input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .profile-item input:focus,
        .social-item input:focus {
            outline: none;
            border-color: #c4b5fd;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Scrollbar styling */
        .settings-panel::-webkit-scrollbar,
        .preview-frame::-webkit-scrollbar {
            width: 6px;
        }

        .settings-panel::-webkit-scrollbar-track,
        .preview-frame::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-panel::-webkit-scrollbar-thumb,
        .preview-frame::-webkit-scrollbar-thumb {
            background: rgba(196, 181, 253, 0.2);
            border-radius: 3px;
        }

        .settings-panel::-webkit-scrollbar-thumb:hover,
        .preview-frame::-webkit-scrollbar-thumb:hover {
            background: rgba(196, 181, 253, 0.4);
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <a href="/" class="sidebar-header">
            <div class="sidebar-logo">🖤</div>
            <div class="sidebar-title">GothSlol</div>
        </a>

        <div class="nav-section">
            <div class="nav-section-title">Compte</div>
            <a href="/customize" class="nav-item active">
                <span class="nav-icon">⚙️</span>
                Personnaliser
            </a>
            <a href="/links" class="nav-item">
                <span class="nav-icon">🔗</span>
                Liens
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Pages</div>
            <a href="/" class="nav-item">
                <span class="nav-icon">👁️</span>
                Voir ma page
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Actions</div>
            <a class="nav-item" onclick="logout()" style="cursor: pointer;">
                <span class="nav-icon">🚪</span>
                Déconnexion
            </a>
        </div>
    </div>

    <div class="main-content">
        <!-- Settings Panel -->
        <div class="settings-panel">
            <h2 style="margin-bottom: 25px; font-size: 18px;">Personnaliser votre page</h2>

            <!-- Background Section -->
            <div class="section-title">Arrière-plan</div>
            <div class="form-group">
                <label>URL de l'image/vidéo</label>
                <input type="text" id="bgUrl" placeholder="https://r2.guns.lol/...">
            </div>
            <div class="form-group">
                <label>Opacité (%)</label>
                <input type="number" id="bgOpacity" min="0" max="100" value="35">
            </div>

            <!-- Music Section -->
            <div class="section-title">Musique de fond</div>
            <div class="form-group">
                <label>URL audio (MP3)</label>
                <input type="text" id="musicUrl" placeholder="attached_assets/music.mp3">
            </div>
            <p style="font-size: 12px; color: #888; margin-top: -15px; margin-bottom: 15px;">💡 Cliquez sur l'icône de volume en haut à gauche pour contrôler la musique</p>

            <!-- Cursor Section -->
            <div class="section-title">Curseur personnalisé</div>
            <div class="form-group">
                <label>URL du curseur (PNG)</label>
                <input type="text" id="cursorUrl" placeholder="attached_assets/cursor.png">
            </div>

            <!-- Profiles Section -->
            <div class="section-title">Profils</div>
            <div id="profilesList"></div>
            <button class="btn btn-secondary" onclick="addProfile()">+ Ajouter un profil</button>

            <!-- Social Links Section -->
            <div class="section-title">Liens sociaux</div>
            <div id="socialLinksList"></div>
            <button class="btn btn-secondary" onclick="addSocialLink()">+ Ajouter un lien</button>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveSettings()">Enregistrer</button>
                <button class="btn btn-secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class=\"preview-title\">Aperçu en temps réel</div>
            <div class=\"preview-frame\">
                <div class=\"preview-bg\" id=\"previewBg\"></div>
                <div class=\"preview-content\">
                    <div style="color: #aaa; font-size: 12px; text-align: center;">Aperçu du fond</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login';
        }

        // Default page settings avec tous les paramètres d'index.html
        const DEFAULT_SETTINGS = {
            // Site info
            siteName: 'goths.lol',
            
            // Background
            bgUrl: 'https://r2.guns.lol/ed920f02-a70f-47a3-a7e9-726df6ca5496.gif',
            bgOpacity: 35,
            
            // Audio/Music
            musicUrl: 'attached_assets/deadprettygirlee.mp3',
            
            // Cursor
            cursorUrl: 'attached_assets/cursor3.png',
            
            // Profiles/Links
            profiles: [
                { name: 'ev', url: 'ev.html', avatar: 'attached_assets/985e453463ba0af44c2e2df2bcca2fe9.jpg', role: 'socials' },
                { name: 'ey', url: 'ey.html', avatar: 'attached_assets/cce169f5e720f9a062dcf82f3934cd12.jpg', role: 'socials' }
            ],
            
            // Social links
            socialLinks: [
                { name: 'Discord', url: 'https://discord.gg/gothtag', icon: 'attached_assets/discordlogo.png' },
                { name: 'GOTHTAG', url: '/goth', icon: 'attached_assets/gothslink.png' },
                { name: 'Website', url: 'https://gothtag.com', icon: 'attached_assets/tag.png' }
            ]
        };

        // Load settings
        function loadSettings() {
            const saved = localStorage.getItem('pageSettings');
            const settings = saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
            
            // Merge with defaults
            const merged = { ...DEFAULT_SETTINGS, ...settings };
            
            // Load basic settings
            document.getElementById('bgUrl').value = merged.bgUrl;
            document.getElementById('bgOpacity').value = merged.bgOpacity;
            document.getElementById('musicUrl').value = merged.musicUrl;
            document.getElementById('cursorUrl').value = merged.cursorUrl;
            
            // Load profiles
            const profilesContainer = document.getElementById('profilesList');
            profilesContainer.innerHTML = '';
            merged.profiles.forEach((profile, idx) => {
                profilesContainer.insertAdjacentHTML('beforeend', `
                    <div class="form-group profile-item" data-index="${idx}">
                        <label>Profil ${idx + 1}</label>
                        <input type="text" class="profile-name" value="${profile.name}" placeholder="Nom">
                        <input type="text" class="profile-url" value="${profile.url}" placeholder="URL">
                        <input type="text" class="profile-avatar" value="${profile.avatar}" placeholder="Avatar URL">
                        <input type="text" class="profile-role" value="${profile.role}" placeholder="Rôle">
                        <button type="button" class="btn btn-secondary" onclick="removeProfile(${idx})">Supprimer</button>
                    </div>
                `);
            });
            
            // Load social links
            const socialContainer = document.getElementById('socialLinksList');
            socialContainer.innerHTML = '';
            merged.socialLinks.forEach((link, idx) => {
                socialContainer.insertAdjacentHTML('beforeend', `
                    <div class="form-group social-item" data-index="${idx}">
                        <label>Lien social ${idx + 1}</label>
                        <input type="text" class="social-name" value="${link.name}" placeholder="Nom">
                        <input type="text" class="social-url" value="${link.url}" placeholder="URL">
                        <input type="text" class="social-icon" value="${link.icon}" placeholder="Icon URL">
                        <button type="button" class="btn btn-secondary" onclick="removeSocialLink(${idx})">Supprimer</button>
                    </div>
                `);
            });
            
            updatePreview();
        }

        // Update preview
        function updatePreview() {
            const bgUrl = document.getElementById('bgUrl').value;
            const bgOpacity = document.getElementById('bgOpacity').value;
            
            const bgEl = document.getElementById('previewBg');
            if (bgUrl) {
                bgEl.style.backgroundImage = `url('${bgUrl}')`;
                bgEl.style.opacity = bgOpacity / 100;
            }
        }

        // Save all settings
        async function saveSettings() {
            const settings = {
                bgUrl: document.getElementById('bgUrl').value,
                bgOpacity: document.getElementById('bgOpacity').value,
                musicUrl: document.getElementById('musicUrl').value,
                cursorUrl: document.getElementById('cursorUrl').value,
                profiles: [],
                socialLinks: []
            };

            // Collect profiles
            document.querySelectorAll('.profile-item').forEach(item => {
                settings.profiles.push({
                    name: item.querySelector('.profile-name').value,
                    url: item.querySelector('.profile-url').value,
                    avatar: item.querySelector('.profile-avatar').value,
                    role: item.querySelector('.profile-role').value
                });
            });

            // Collect social links
            document.querySelectorAll('.social-item').forEach(item => {
                settings.socialLinks.push({
                    name: item.querySelector('.social-name').value,
                    url: item.querySelector('.social-url').value,
                    icon: item.querySelector('.social-icon').value
                });
            });

            localStorage.setItem('pageSettings', JSON.stringify(settings));
            alert('Paramètres enregistrés!');
        }

        function addProfile() {
            const container = document.getElementById('profilesList');
            const idx = container.children.length;
            container.insertAdjacentHTML('beforeend', `
                <div class="form-group profile-item" data-index="${idx}">
                    <label>Profil ${idx + 1}</label>
                    <input type="text" class="profile-name" placeholder="Nom">
                    <input type="text" class="profile-url" placeholder="URL">
                    <input type="text" class="profile-avatar" placeholder="Avatar URL">
                    <input type="text" class="profile-role" placeholder="Rôle">
                    <button type="button" class="btn btn-secondary" onclick="removeProfile(${idx})">Supprimer</button>
                </div>
            `);
        }

        function removeProfile(idx) {
            document.querySelectorAll('.profile-item')[idx]?.remove();
        }

        function addSocialLink() {
            const container = document.getElementById('socialLinksList');
            const idx = container.children.length;
            container.insertAdjacentHTML('beforeend', `
                <div class="form-group social-item" data-index="${idx}">
                    <label>Lien social ${idx + 1}</label>
                    <input type="text" class="social-name" placeholder="Nom">
                    <input type="text" class="social-url" placeholder="URL">
                    <input type="text" class="social-icon" placeholder="Icon URL">
                    <button type="button" class="btn btn-secondary" onclick="removeSocialLink(${idx})">Supprimer</button>
                </div>
            `);
        }

        function removeSocialLink(idx) {
            document.querySelectorAll('.social-item')[idx]?.remove();
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('pageSettings');
            window.location.href = '/login';
        }

        // Event listeners
        document.getElementById('bgUrl').addEventListener('input', updatePreview);
        document.getElementById('bgOpacity').addEventListener('input', updatePreview);

        // Load on start
        loadSettings();
    </script>
</body>
</html>
