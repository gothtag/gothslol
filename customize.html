<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GothSlol - Personnaliser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Onest', sans-serif;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* SIDEBAR NAVIGATION - GUNS.LOL STYLE */
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 20, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            text-decoration: none;
            color: #fff;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(124, 58, 237, 0.2);
            color: #c4b5fd;
        }

        .nav-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .main-content {
            margin-left: 280px;
            width: calc(100% - 280px);
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .settings-panel {
            flex: 1;
            min-width: 280px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            backdrop-filter: blur(10px);
            max-height: 90vh;
            overflow-y: auto;
        }

        .preview-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .preview-title {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .preview-frame {
            width: 100%;
            background: rgba(20, 20, 20, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            max-height: 80vh;
            overflow-y: auto;
        }

        .preview-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: 0;
        }

        .preview-content {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .preview-logo {
            font-size: 48px;
            opacity: 0.9;
        }

        .preview-name {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
        }

        .preview-bio {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c4b5fd;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .color-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .color-input-group {
            flex: 1;
        }

        .color-input-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .color-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-picker {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .color-hex {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #c4b5fd;
            margin-bottom: 15px;
            margin-top: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(196, 181, 253, 0.2);
        }

        /* Scrollbar styling */
        .settings-panel::-webkit-scrollbar,
        .preview-frame::-webkit-scrollbar {
            width: 6px;
        }

        .settings-panel::-webkit-scrollbar-track,
        .preview-frame::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-panel::-webkit-scrollbar-thumb,
        .preview-frame::-webkit-scrollbar-thumb {
            background: rgba(196, 181, 253, 0.2);
            border-radius: 3px;
        }

        .settings-panel::-webkit-scrollbar-thumb:hover,
        .preview-frame::-webkit-scrollbar-thumb:hover {
            background: rgba(196, 181, 253, 0.4);
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <a href="/" class="sidebar-header">
            <div class="sidebar-logo">🖤</div>
            <div class="sidebar-title">GothSlol</div>
        </a>

        <div class="nav-section">
            <div class="nav-section-title">Compte</div>
            <a href="/customize" class="nav-item active">
                <span class="nav-icon">⚙️</span>
                Personnaliser
            </a>
            <a href="/links" class="nav-item">
                <span class="nav-icon">🔗</span>
                Liens
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Pages</div>
            <a href="/" class="nav-item">
                <span class="nav-icon">👁️</span>
                Voir ma page
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Actions</div>
            <a class="nav-item" onclick="logout()" style="cursor: pointer;">
                <span class="nav-icon">🚪</span>
                Déconnexion
            </a>
        </div>
    </div>

    <div class="main-content">
        <!-- Settings Panel -->
        <div class="settings-panel">
            <h2 style="margin-bottom: 25px; font-size: 18px;">Personnaliser votre page</h2>

            <!-- Logo Section -->
            <div class="section-title">Logo & Nom</div>
            <div class="form-group">
                <label>Logo (emoji ou texte)</label>
                <input type="text" id="logoInput" placeholder="🖤" maxlength="5">
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="nameInput" placeholder="Entrez votre nom">
            </div>

            <!-- Bio Section -->
            <div class="section-title">Bio</div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="bioInput" placeholder="Parlez de vous..."></textarea>
            </div>

            <!-- Colors Section -->
            <div class="section-title">Couleurs</div>
            <div class="color-group">
                <div class="color-input-group">
                    <label>Couleur primaire</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="primaryColor" class="color-picker" value="#7c3aed">
                        <input type="text" id="primaryHex" class="color-hex" value="#7c3aed" readonly>
                    </div>
                </div>
                <div class="color-input-group">
                    <label>Couleur accent</label>
                    <div class="color-input-wrapper">
                        <input type="color" id="accentColor" class="color-picker" value="#ec4899">
                        <input type="text" id="accentHex" class="color-hex" value="#ec4899" readonly>
                    </div>
                </div>
            </div>

            <!-- Background Section -->
            <div class="section-title">Arrière-plan</div>
            <div class="form-group">
                <label>URL de l'image</label>
                <input type="text" id="bgImageUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Opacité de l'image (%)</label>
                <input type="number" id="bgOpacity" min="0" max="100" value="30">
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveSettings()">Enregistrer</button>
                <button class="btn btn-secondary" onclick="logout()">Déconnexion</button>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class=\"preview-title\">Aperçu en temps réel</div>
            <div class=\"preview-frame\">
                <div class=\"preview-bg\" id=\"previewBg\"></div>
                <div class=\"preview-content\">
                    <div class=\"preview-logo\" id=\"previewLogo\">🖤</div>
                    <div class=\"preview-name\" id=\"previewName\">Votre nom</div>
                    <div class=\"preview-bio\" id=\"previewBio\">Description</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = '/login';
        }

        // Load settings from localStorage
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('pageSettings')) || {
                logo: '🖤',
                name: 'Votre site',
                bio: 'Bienvenue sur ma page',
                primaryColor: '#7c3aed',
                accentColor: '#ec4899',
                bgImage: '',
                bgOpacity: 30
            };

            document.getElementById('logoInput').value = settings.logo;
            document.getElementById('nameInput').value = settings.name;
            document.getElementById('bioInput').value = settings.bio;
            document.getElementById('primaryColor').value = settings.primaryColor;
            document.getElementById('primaryHex').value = settings.primaryColor;
            document.getElementById('accentColor').value = settings.accentColor;
            document.getElementById('accentHex').value = settings.accentColor;
            document.getElementById('bgImageUrl').value = settings.bgImage || '';
            document.getElementById('bgOpacity').value = settings.bgOpacity || 30;

            updatePreview();
        }

        // Update preview in real-time
        function updatePreview() {
            const logo = document.getElementById('logoInput').value || '🖤';
            const name = document.getElementById('nameInput').value || 'Votre nom';
            const bio = document.getElementById('bioInput').value || 'Description';
            const bgImage = document.getElementById('bgImageUrl').value;
            const bgOpacity = document.getElementById('bgOpacity').value;

            document.getElementById('previewLogo').textContent = logo;
            document.getElementById('previewName').textContent = name;
            document.getElementById('previewBio').textContent = bio;

            const bgEl = document.getElementById('previewBg');
            if (bgImage) {
                bgEl.style.backgroundImage = `url('${bgImage}')`;
                bgEl.style.opacity = bgOpacity / 100;
            } else {
                bgEl.style.backgroundImage = 'none';
                bgEl.style.opacity = '0';
            }
        }

        // Color picker handlers
        document.getElementById('primaryColor').addEventListener('input', (e) => {
            document.getElementById('primaryHex').value = e.target.value;
            updatePreview();
        });

        document.getElementById('accentColor').addEventListener('input', (e) => {
            document.getElementById('accentHex').value = e.target.value;
            updatePreview();
        });

        // Real-time preview updates
        document.getElementById('logoInput').addEventListener('input', updatePreview);
        document.getElementById('nameInput').addEventListener('input', updatePreview);
        document.getElementById('bioInput').addEventListener('input', updatePreview);
        document.getElementById('bgImageUrl').addEventListener('input', updatePreview);
        document.getElementById('bgOpacity').addEventListener('input', updatePreview);

        // Save settings
        async function saveSettings() {
            const settings = {
                logo: document.getElementById('logoInput').value,
                name: document.getElementById('nameInput').value,
                bio: document.getElementById('bioInput').value,
                primaryColor: document.getElementById('primaryColor').value,
                accentColor: document.getElementById('accentColor').value,
                bgImage: document.getElementById('bgImageUrl').value,
                bgOpacity: document.getElementById('bgOpacity').value
            };

            localStorage.setItem('pageSettings', JSON.stringify(settings));

            // Try to save to GitHub via Netlify Function
            try {
                const response = await fetch('/.netlify/functions/save-settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(settings)
                });

                if (response.ok) {
                    alert('Paramètres enregistrés avec succès!');
                } else {
                    alert('Paramètres enregistrés localement (serveur indisponible)');
                }
            } catch (error) {
                console.log('Sauvegarde serveur échouée, paramètres en localStorage:', settings);
                alert('Paramètres enregistrés localement');
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('pageSettings');
            window.location.href = '/login';
        }

        // Load settings on page load
        loadSettings();
    </script>
</body>
</html>
