    <script type="application/ld+json">

    <style>
        @font-face {
            font-family: 'Chillax';
            src: url(//cdn.fontshare.com/wf/XASL35KKT35X3ACCBCOQKKABSR6AT3FX/6MU5BWUUPHCFUHM2F3E3QPQGKXCVBUOO/WZY5PMNTII6NKOB2TTIAX7QVAWMSY2DQ.woff2) format('woff2'), url(//cdn.fontshare.com/wf/XASL35KKT35X3ACCBCOQKKABSR6AT3FX/6MU5BWUUPHCFUHM2F3E3QPQGKXCVBUOO/WZY5PMNTII6NKOB2TTIAX7QVAWMSY2DQ.woff) format('woff'), url(//cdn.fontshare.com/wf/XASL35KKT35X3ACCBCOQKKABSR6AT3FX/6MU5BWUUPHCFUHM2F3E3QPQGKXCVBUOO/WZY5PMNTII6NKOB2TTIAX7QVAWMSY2DQ.ttf) format('truetype');
        }

        body {
            margin: 0;
            padding: 0;
            background: url('https://r2.guns.lol/ed920f02-a70f-47a3-a7e9-726df6ca5496.gif') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: url('attached_assets/cursor3.png') 8 8, auto;
        }

        .logo {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: black;
            font-family: 'Roboto', sans-serif;
            animation: glow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.4))
                    drop-shadow(0 0 10px rgba(0, 0, 0, 0.4));
            text-transform: lowercase;
            letter-spacing: 2px;
            text-align: center;
            will-change: transform, filter;
            transform: translate3d(0, 0, 0);
            cursor: url('attached_assets/cursor3.png') 8 8, pointer;
        }

        .content-frame {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2) url(https://assets.guns.lol/guns_dot.png) repeat;
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            filter: brightness(1.1);
            max-width: 600px;
            padding: 3rem;
            width: 100%;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .texture {
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 1;
            background: transparent url(https://assets.guns.lol/guns_dot.png) repeat 0 0;
            position: fixed;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.4))
                        drop-shadow(0 0 10px rgba(0, 0, 0, 0.4));
            }
            to {
                filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.6))
                        drop-shadow(0 0 15px rgba(0, 0, 0, 0.6))
                        drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            }
        }

        .links {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            position: relative;
            text-align: center;
            transition: all 0.3s ease;
            cursor: url('attached_assets/cursor3.png') 8 8, pointer;
            text-decoration: none;
            color: white;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-gradient-ring {
            position: absolute;
            width: 90px;
            height: 90px;
            background: conic-gradient(from 0deg, #707070 0%, #707070 35%, #1a1a1a 50%, #707070 65%, #707070 100%);
            border-radius: 50%;
            animation: rotateGradient 3s linear infinite;
            z-index: 5;
        }

        @keyframes rotateGradient {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            z-index: 10;
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .avatar:hover .avatar-overlay {
            opacity: 1;
        }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-overlay span {
            color: white;
            font-size: 1.2rem;
        }

        .profile-name {
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Chillax', sans-serif !important;
            font-size: 1.2rem;
            font-weight: 500;
            text-transform: lowercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .profile-role {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 2.5rem;
            }
            .links {
                flex-direction: column;
                gap: 1rem;
            }
            .avatar-container {
                width: 90px;
                height: 90px;
            }
            .avatar-gradient-ring {
                width: 80px;
                height: 80px;
            }
            .avatar {
                width: 75px;
                height: 75px;
            }
            .content-frame {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 2rem;
            }
            .links {
                gap: 0.8rem;
            }
            .avatar-container {
                width: 80px;
                height: 80px;
            }
            .avatar-gradient-ring {
                width: 75px;
                height: 75px;
            }
            .avatar {
                width: 70px;
                height: 70px;
            }
            .content-frame {
                padding: 1rem;
                max-width: 95vw;
            }
            .profile-name {
                font-size: 1rem;
            }
            .profile-role {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="texture"></div>
    <div class="content-frame">
        <div class="logo">goths<span>.</span>lol</div>
        <div class="links">
            <a href="ev.html" class="profile-card">
                <div class="avatar-container">
                    <div class="avatar-gradient-ring"></div>
                    <div class="avatar">
                        <img src="attached_assets/985e453463ba0af44c2e2df2bcca2fe9.jpg" alt="@ev">
                        <div class="avatar-overlay">
                            <span>➜]</span>
                        </div>
                    </div>
                </div>
                <div class="profile-name">ev</div>
                <div class="profile-role">socials</div>
            </a>
            <a href="ey.html" class="profile-card">
                <div class="avatar-container">
                    <div class="avatar-gradient-ring"></div>
                    <div class="avatar">
                        <img src="attached_assets/cce169f5e720f9a062dcf82f3934cd12.jpg" alt="@ey">
                        <div class="avatar-overlay">
                            <span>➜]</span>
                        </div>
                    </div>
                </div>
                <div class="profile-name">ey</div>
                <div class="profile-role">socials</div>
            </a>
        </div>
    </div>

    <script>
        // Parallax 3D sur le cadre
        const frame = document.querySelector('.content-frame');
        if (frame) {
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                frame.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
            });

            document.addEventListener('mouseleave', function() {
                frame.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
            });
        }
    </script>
</body>
</html>
