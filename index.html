    <script>
        const frame = document.querySelector('.content-frame');
        const noContextElements = document.querySelectorAll('.no-context');
        if (frame) {
            const resetFrameTransform = function() {
                frame.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
            };

            const applyFrameTransform = function(clientX, clientY) {
                const x = (clientX / window.innerWidth - 0.5) * 20;
                const y = (clientY / window.innerHeight - 0.5) * 20;
                frame.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
            };

            if (window.matchMedia('(pointer: coarse)').matches) {
                frame.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    if (touch) {
                        applyFrameTransform(touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                frame.addEventListener('touchmove', function(e) {
                    const touch = e.touches[0];
                    if (touch) {
                        applyFrameTransform(touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                frame.addEventListener('touchend', resetFrameTransform);
                frame.addEventListener('touchcancel', resetFrameTransform);
            } else {
                document.addEventListener('mousemove', function(e) {
                    applyFrameTransform(e.clientX, e.clientY);
                });

                document.addEventListener('mouseleave', resetFrameTransform);
            }
        }

        for (const element of noContextElements) {
            element.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        }

        const AVATAR_SLOTS = ['ev', 'ey'];
        const AVATAR_POLL_INTERVAL_MS = 10000;

        const COPY_UI = (function() {
            const language = (navigator.language || 'en').toLowerCase();
            const isFrench = language.startsWith('fr');
            if (isFrench) {
                return {
                    tooltip: 'Copier le lien du serveur',
                    copied: 'Lien copié',
                    unavailable: 'Lien d\'invitation indisponible',
                    failed: 'Échec de la copie'
                };
            }
            return {
                tooltip: 'Copy server link',
                copied: 'Link copied',
                unavailable: 'Invite link unavailable',
                failed: 'Copy failed'
            };
        })();

        function avatarStorageKey(slot) {
            return `discord-avatar-url:${slot}`;
        }

        function clanBadgeStorageKey(slot) {
            return `discord-clan-badge:${slot}`;
        }

        function clanTagStorageKey(slot) {
            return `discord-clan-tag:${slot}`;
        }

        function clanGuildIdStorageKey(slot) {
            return `discord-clan-guild-id:${slot}`;
        }

        function clanInviteUrlStorageKey(slot) {
            return `discord-clan-invite-url:${slot}`;
        }
        
        function avatarDecorationStorageKey(slot) {
            return `discord-avatar-decoration:${slot}`;
        }

        const DECORATION_CACHE_KEY = 'discord-decoration-cache';

        function getDecorationCacheList() {
            try {
                const raw = localStorage.getItem(DECORATION_CACHE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (_err) {
                return [];
            }
        }

        function setDecorationCacheList(list) {
            localStorage.setItem(DECORATION_CACHE_KEY, JSON.stringify(list));
        }

        function addDecorationToCache(url) {
            if (!url) {
                return;
            }

            const list = getDecorationCacheList();
            if (list.includes(url)) {
                return;
            }

            list.unshift(url);
            if (list.length > 20) {
                list.length = 20;
            }

            setDecorationCacheList(list);
        }

        function prefetchDecorationUrls() {
            const list = getDecorationCacheList();
            for (const url of list) {
                const img = new Image();
                img.src = url;
            }
        }

        function normalizeAvatarUrl(url) {
            if (!url) {
                return '';
            }

            return String(url).split('?')[0];
        }

        function addCacheBuster(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}v=${Date.now()}`;
        }

        function hydrateCachedAvatars() {
            for (const slot of AVATAR_SLOTS) {
                const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
                if (!image) {
                    continue;
                }

                const cachedUrl = localStorage.getItem(avatarStorageKey(slot));
                if (cachedUrl) {
                    image.src = cachedUrl;
                }
            }
        }

        function hydrateCachedClanBadges() {
            for (const slot of AVATAR_SLOTS) {
                const clanBadgeEl = document.querySelector(`.clan-badge[data-discord-slot="${slot}"]`);
                if (!clanBadgeEl) {
                    continue;
                }

                const cachedBadgeUrl = localStorage.getItem(clanBadgeStorageKey(slot));
                const cachedTag = localStorage.getItem(clanTagStorageKey(slot));
                const cachedGuildId = localStorage.getItem(clanGuildIdStorageKey(slot));
                const cachedInviteUrl = localStorage.getItem(clanInviteUrlStorageKey(slot));
                
                if (cachedBadgeUrl && cachedTag) {
                    const badgeImg = clanBadgeEl.querySelector('.clan-badge-img');
                    const badgeTag = clanBadgeEl.querySelector('.clan-tag');
                    
                    if (badgeImg && badgeTag) {
                        badgeImg.src = cachedBadgeUrl;
                        badgeImg.alt = cachedTag;
                        badgeTag.textContent = cachedTag;
                        clanBadgeEl.dataset.guildId = cachedGuildId || '';
                        clanBadgeEl.dataset.inviteUrl = cachedInviteUrl || '';
                        clanBadgeEl.title = COPY_UI.tooltip;
                        clanBadgeEl.style.display = 'inline-flex';
                    }
                }
            }
        }
        
        function hydrateCachedAvatarDecorations() {
            for (const slot of AVATAR_SLOTS) {
                const decorationEl = document.querySelector(`.avatar-decoration[data-discord-slot="${slot}"]`);
                if (!decorationEl) {
                    continue;
                }

                const cachedDecorationUrl = localStorage.getItem(avatarDecorationStorageKey(slot));

                if (cachedDecorationUrl) {
                    const decorationImg = decorationEl.querySelector('img');
                    if (decorationImg) {
                        decorationImg.onload = function() {
                            decorationEl.style.display = 'block';
                        };
                        decorationImg.src = cachedDecorationUrl;
                    }
                    addDecorationToCache(cachedDecorationUrl);
                }
            }
        }

        async function fetchSlotData(slot, force = false) {
            try {
                const response = await fetch(`/.netlify/functions/discord-avatars?slot=${slot}${force ? '&force=1' : ''}`, {
                    cache: 'no-store'
                });

                const data = await response.json();
                return data?.[slot] || null;
            } catch (_err) {
                return null;
            }
        }

        async function syncAvatarSlot(slot, force = false, syncDecorations = true) {
            const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
            const clanBadgeEl = document.querySelector(`.clan-badge[data-discord-slot="${slot}"]`);
            const avatarDecorationEl = document.querySelector(`.avatar-decoration[data-discord-slot="${slot}"]`);
            if (!image) {
                return;
            }

            const slotData = await fetchSlotData(slot, force);
            if (!slotData || !slotData.avatarUrl) {
                return;
            }

            const avatarUrl = slotData.avatarUrl;
            const nextUrl = addCacheBuster(avatarUrl);
            const currentBase = normalizeAvatarUrl(image.src);
            const nextBase = normalizeAvatarUrl(nextUrl);
            if (currentBase === nextBase) {
                localStorage.setItem(avatarStorageKey(slot), nextUrl);
            } else {
                const preload = new Image();
                preload.onload = function() {
                    image.src = nextUrl;
                    localStorage.setItem(avatarStorageKey(slot), nextUrl);
                };
                preload.src = nextUrl;
            }

            // Sync clan badge with smart update
            if (clanBadgeEl) {
                const cachedBadgeUrl = localStorage.getItem(clanBadgeStorageKey(slot));
                const cachedTag = localStorage.getItem(clanTagStorageKey(slot));
                const cachedGuildId = localStorage.getItem(clanGuildIdStorageKey(slot));
                const cachedInviteUrl = localStorage.getItem(clanInviteUrlStorageKey(slot));
                const newBadgeUrl = slotData.clanBadgeUrl || null;
                const newTag = slotData.clanTag || null;
                const newGuildId = slotData.clanGuildId || null;
                const newInviteUrl = slotData.clanInviteUrl || null;

                if (newBadgeUrl && newTag) {
                    const badgeImg = clanBadgeEl.querySelector('.clan-badge-img');
                    const badgeTag = clanBadgeEl.querySelector('.clan-tag');
                    
                    if (badgeImg && badgeTag) {
                        // Only update if badge URL or tag changed
                        if (cachedBadgeUrl !== newBadgeUrl || cachedTag !== newTag) {
                            badgeImg.src = newBadgeUrl;
                            badgeImg.alt = newTag;
                            badgeTag.textContent = newTag;
                            clanBadgeEl.style.display = 'inline-flex';
                        }
                        clanBadgeEl.dataset.guildId = newGuildId || '';
                        clanBadgeEl.dataset.inviteUrl = newInviteUrl || '';
                        clanBadgeEl.title = COPY_UI.tooltip;
                        // Always update cache
                        localStorage.setItem(clanBadgeStorageKey(slot), newBadgeUrl);
                        localStorage.setItem(clanTagStorageKey(slot), newTag);
                        localStorage.setItem(clanGuildIdStorageKey(slot), newGuildId || '');
                        localStorage.setItem(clanInviteUrlStorageKey(slot), newInviteUrl || '');
                    }
                } else if (slotData.cached && cachedBadgeUrl && cachedTag) {
                    // Keep cached badge on cached responses to avoid flicker
                    clanBadgeEl.dataset.guildId = cachedGuildId || '';
                    clanBadgeEl.dataset.inviteUrl = cachedInviteUrl || '';
                    clanBadgeEl.title = COPY_UI.tooltip;
                    clanBadgeEl.style.display = 'inline-flex';
                } else {
                    // No clan badge - clear cache and hide
                    localStorage.removeItem(clanBadgeStorageKey(slot));
                    localStorage.removeItem(clanTagStorageKey(slot));
                    localStorage.removeItem(clanGuildIdStorageKey(slot));
                    localStorage.removeItem(clanInviteUrlStorageKey(slot));
                    clanBadgeEl.dataset.guildId = '';
                    clanBadgeEl.dataset.inviteUrl = '';
                    clanBadgeEl.style.display = 'none';
                }
            }
            
            // Sync avatar decoration with smart update
            if (syncDecorations && avatarDecorationEl) {
                const cachedDecorationUrl = localStorage.getItem(avatarDecorationStorageKey(slot));
                const newDecorationUrl = slotData.avatarDecorationUrl || null;

                if (newDecorationUrl) {
                    const decorationImg = avatarDecorationEl.querySelector('img');

                    if (decorationImg) {
                        if (cachedDecorationUrl === newDecorationUrl) {
                            decorationImg.onload = function() {
                                avatarDecorationEl.style.display = 'block';
                            };
                            decorationImg.src = newDecorationUrl;
                            localStorage.setItem(avatarDecorationStorageKey(slot), newDecorationUrl);
                            addDecorationToCache(newDecorationUrl);
                        } else {
                            const preload = new Image();
                            preload.onload = function() {
                                decorationImg.src = newDecorationUrl;
                                avatarDecorationEl.style.display = 'block';
                                localStorage.setItem(avatarDecorationStorageKey(slot), newDecorationUrl);
                                addDecorationToCache(newDecorationUrl);
                            };
                            preload.src = newDecorationUrl;
                        }
                    }
                } else if (slotData.cached && cachedDecorationUrl) {
                    // Keep cached decoration on cached responses to avoid flicker
                    avatarDecorationEl.style.display = 'block';
                } else {
                    // No decoration - clear cache and hide
                    localStorage.removeItem(avatarDecorationStorageKey(slot));
                    avatarDecorationEl.style.display = 'none';
                }
            }
        }

        async function syncAllAvatars(force = false, syncDecorations = true) {
            await Promise.all(AVATAR_SLOTS.map((slot) => syncAvatarSlot(slot, force, syncDecorations)));
        }

        function attachAvatarFallbacks() {
            const images = document.querySelectorAll('img[data-discord-slot]');

            for (const image of images) {
                image.addEventListener('error', function() {
                    const fallback = image.getAttribute('data-fallback-src');
                    if (!fallback) {
                        return;
                    }

                    const absoluteFallback = new URL(fallback, window.location.href).href;
                    if (image.src !== absoluteFallback) {
                        image.src = fallback;
                    }
                });
            }
        }

        function setupClanBadgeCopy() {
            const badges = document.querySelectorAll('.clan-badge[data-discord-slot]');

            const feedback = document.createElement('div');
            feedback.className = 'copy-feedback';
            document.body.appendChild(feedback);

            let feedbackTimeout = null;

            const showFeedback = function(message) {
                feedback.textContent = message;
                feedback.classList.add('show');
                if (feedbackTimeout) {
                    clearTimeout(feedbackTimeout);
                }
                feedbackTimeout = setTimeout(function() {
                    feedback.classList.remove('show');
                }, 1200);
            };

            for (const badge of badges) {
                badge.addEventListener('click', async function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    const inviteUrl = badge.dataset.inviteUrl || '';
                    const textToCopy = inviteUrl;

                    if (!textToCopy) {
                        showFeedback(COPY_UI.unavailable);
                        return;
                    }

                    try {
                        await navigator.clipboard.writeText(textToCopy);
                        badge.classList.add('copied');
                        showFeedback(COPY_UI.copied);
                        window.open(textToCopy, '_blank', 'noopener,noreferrer');
                        setTimeout(function() {
                            badge.classList.remove('copied');
                        }, 900);
                    } catch (_err) {
                        showFeedback(COPY_UI.failed);
                    }
                });
            }
        }

        attachAvatarFallbacks();
        setupClanBadgeCopy();
        hydrateCachedAvatars();
        hydrateCachedClanBadges();
        hydrateCachedAvatarDecorations();
        prefetchDecorationUrls();
        syncAllAvatars(true, true);

        setInterval(function() {
            if (document.visibilityState === 'visible') {
                syncAllAvatars(false, false);
            }
        }, AVATAR_POLL_INTERVAL_MS);

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                syncAllAvatars(true, false);
            }
        });

        const audio = document.getElementById('background-music');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeFill = document.getElementById('volume-fill');
        const volumeButton = document.getElementById('volume-button');
        const volumeControl = document.querySelector('.volume-control');
        const splashScreen = document.getElementById('splash-screen');
        const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

        if (audio && volumeSlider && volumeFill) {
            audio.volume = 1.0;

            const updateVolumeIcon = function() {
                if (audio.volume === 0 || audio.muted || audio.paused) {
                    volumeButton.classList.remove('unmuted');
                    volumeButton.classList.add('muted');
                } else {
                    volumeButton.classList.remove('muted');
                    volumeButton.classList.add('unmuted');
                }
            };

            const updateVolume = function(value) {
                const volume = value / 100;
                audio.volume = volume;
                volumeFill.style.width = value + '%';
                updateVolumeIcon();
            };

            volumeSlider.addEventListener('input', function(e) {
                updateVolume(e.target.value);
            });

            volumeButton.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isCoarsePointer && volumeControl) {
                    volumeControl.classList.add('open');
                }
                if (audio.paused) {
                    audio.play().catch(function() {});
                } else {
                    audio.pause();
                }
                updateVolumeIcon();
            });

            audio.addEventListener('play', updateVolumeIcon);
            audio.addEventListener('pause', updateVolumeIcon);
            audio.addEventListener('volumechange', updateVolumeIcon);

            updateVolumeIcon();

            if (isCoarsePointer && volumeControl) {
                volumeSlider.addEventListener('pointerdown', function(e) {
                    e.stopPropagation();
                    volumeControl.classList.add('open');
                });

                volumeControl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    volumeControl.classList.add('open');
                });

                document.addEventListener('click', function(e) {
                    if (!volumeControl.contains(e.target)) {
                        volumeControl.classList.remove('open');
                    }
                });
            }
        }

        if (splashScreen) {
            const bgLayer = document.querySelector('.background-layer');
            const audio = document.getElementById('background-music');
            if (bgLayer) {
                bgLayer.style.backgroundImage = 'none';
            }

            splashScreen.addEventListener('click', function() {
                document.body.classList.add('started');
                splashScreen.classList.add('hidden');
                if (bgLayer) {
                    bgLayer.style.backgroundImage = "url('https://r2.guns.lol/ed920f02-a70f-47a3-a7e9-726df6ca5496.gif?v=" + Date.now() + "')";
                }
                if (audio && audio.src) {
                    audio.play().catch(() => {});
                }
            });
        }

    </script>

    <script>
        // Admin Edit Mode Script
        let isEditMode = false;

        function enableEditMode() {
            isEditMode = true;
            document.body.contentEditable = true;
            document.body.style.border = '2px dashed red';

            // Make profile names editable
            const profileNames = document.querySelectorAll('.profile-name');
            profileNames.forEach(name => {
                name.contentEditable = true;
                name.style.border = '1px solid yellow';
            });

            // Add upload buttons for avatars
            const avatars = document.querySelectorAll('.avatar img');
            avatars.forEach(img => {
                const uploadBtn = document.createElement('input');
                uploadBtn.type = 'file';
                uploadBtn.accept = 'image/*';
                uploadBtn.style.position = 'absolute';
                uploadBtn.style.top = '0';
                uploadBtn.style.left = '0';
                uploadBtn.style.opacity = '0.5';
                uploadBtn.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            img.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });
                img.parentElement.style.position = 'relative';
                img.parentElement.appendChild(uploadBtn);
            });

            // Add save button
            const saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save Changes';
            saveBtn.style.position = 'fixed';
            saveBtn.style.top = '10px';
            saveBtn.style.right = '10px';
            saveBtn.style.zIndex = '10000';
            saveBtn.style.background = 'red';
            saveBtn.style.color = 'white';
            saveBtn.style.border = 'none';
            saveBtn.style.padding = '10px';
            saveBtn.style.cursor = 'pointer';
            saveBtn.addEventListener('click', saveChanges);
            document.body.appendChild(saveBtn);
        }

        function disableEditMode() {
            isEditMode = false;
            document.body.contentEditable = false;
            document.body.style.border = '';

            const profileNames = document.querySelectorAll('.profile-name');
            profileNames.forEach(name => {
                name.contentEditable = false;
                name.style.border = '';
            });

            // Remove upload buttons
            const uploadBtns = document.querySelectorAll('input[type="file"]');
            uploadBtns.forEach(btn => btn.remove());

            // Remove save button
            const saveBtn = document.querySelector('button');
            if (saveBtn) saveBtn.remove();
        }

        function saveChanges() {
            const changes = {
                profileNames: {},
                avatars: {}
            };

            const profileCards = document.querySelectorAll('.profile-card');
            profileCards.forEach(card => {
                const nameEl = card.querySelector('.profile-name');
                const avatarImg = card.querySelector('.avatar img');
                if (nameEl && avatarImg) {
                    const key = nameEl.textContent.trim().split(' ')[0]; // first word as key
                    changes.profileNames[key] = nameEl.textContent.trim();
                    changes.avatars[key] = avatarImg.src;
                }
            });

            localStorage.setItem('gothsEdits', JSON.stringify(changes));
            alert('Changes saved to local storage!');
        }

        function loadChanges() {
            const saved = localStorage.getItem('gothsEdits');
            if (saved) {
                const changes = JSON.parse(saved);
                const profileCards = document.querySelectorAll('.profile-card');
                profileCards.forEach(card => {
                    const nameEl = card.querySelector('.profile-name');
                    const avatarImg = card.querySelector('.avatar img');
                    if (nameEl && avatarImg) {
                        const key = nameEl.textContent.trim().split(' ')[0];
                        if (changes.profileNames[key]) {
                            nameEl.textContent = changes.profileNames[key];
                        }
                        if (changes.avatars[key]) {
                            avatarImg.src = changes.avatars[key];
                        }
                    }
                });
            }
        }

        // Helper function to convert hex to rgb
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // Load settings from server
        async function loadSettings() {
            try {
                const response = await fetch('/.netlify/functions/get-settings');
                const settings = await response.json();
                applySettings(settings);
            } catch (e) {
                console.log('No settings loaded');
            }
        }

        function applySettings(settings) {
            if (settings.bgColor) document.body.style.backgroundColor = settings.bgColor;
            if (settings.generalTextColor) document.body.style.color = settings.generalTextColor;
            if (settings.accentColor) {
                // Apply to accents
            }

            // Handle background - support both images and videos
            const backgroundLayer = document.querySelector('.background-layer');
            if (settings.bgUrl) {
                // Check if it's a video file
                const isVideo = /\.(mp4|webm|ogg)$/i.test(settings.bgUrl);
                if (isVideo) {
                    // Remove existing background image
                    backgroundLayer.style.backgroundImage = 'none';
                    // Create or update video element
                    let bgVideo = backgroundLayer.querySelector('.bg-video');
                    if (!bgVideo) {
                        bgVideo = document.createElement('video');
                        bgVideo.className = 'bg-video';
                        bgVideo.style.position = 'absolute';
                        bgVideo.style.inset = '0';
                        bgVideo.style.width = '100%';
                        bgVideo.style.height = '100%';
                        bgVideo.style.objectFit = 'cover';
                        bgVideo.style.zIndex = '0';
                        bgVideo.loop = true;
                        bgVideo.muted = true;
                        bgVideo.playsInline = true;
                        backgroundLayer.appendChild(bgVideo);
                    }
                    bgVideo.src = settings.bgUrl + (settings.bgUrl.includes('?') ? '&' : '?') + 'v=' + Date.now();
                    bgVideo.play().catch(() => {}); // Autoplay may be blocked
                } else {
                    // Remove video if exists
                    const existingVideo = backgroundLayer.querySelector('.bg-video');
                    if (existingVideo) existingVideo.remove();
                    // Set as background image with cache busting
                    backgroundLayer.style.backgroundImage = `url(${settings.bgUrl + (settings.bgUrl.includes('?') ? '&' : '?') + 'v=' + Date.now()})`;
                }
            }
            if (settings.bgOpacity !== undefined) {
                document.querySelector('.gradient-layer').style.opacity = settings.bgOpacity / 100;
            }
            if (settings.cursorUrl) {
                document.body.style.cursor = `url('${settings.cursorUrl}') 8 8, auto`;
            }

            if (settings.contentFrameColor) {
                const content = document.querySelector('.content-frame');
                if (content) {
                    // Keep frame transparent by using rgba with alpha 0.2
                    const rgb = hexToRgb(settings.contentFrameColor);
                    if (rgb) {
                        content.style.backgroundColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.2)`;
                    } else {
                        content.style.backgroundColor = 'rgba(0, 0, 0, 0.2)';
                    }
                }
            }
            if (settings.frameColor) {
                const content = document.querySelector('.content-frame');
                if (content) content.style.borderColor = settings.frameColor;
            }
            if (settings.profileBorderColor) {
                document.querySelectorAll('.avatar').forEach(el => {
                    el.style.border = `3px solid ${settings.profileBorderColor}`;
                });
            }

            // Apply text colors
            if (settings.profileTextColor) {
                document.querySelectorAll('.profile-name').forEach(el => {
                    el.style.color = settings.profileTextColor;
                });
            }
            if (settings.roleTextColor) {
                document.querySelectorAll('.profile-role').forEach(el => {
                    el.style.color = settings.roleTextColor;
                });
            }
            if (settings.socialTextColor) {
                document.querySelectorAll('.corner-link').forEach(el => {
                    el.style.color = settings.socialTextColor;
                });
            }
            if (settings.socialIconColor) {
                document.querySelectorAll('.corner-link img').forEach(el => {
                    // Apply custom color - for now, use a simple approach
                    el.style.filter = settings.socialIconColor === '#ffffff' ? 'brightness(0) invert(1)' : 
                                    settings.socialIconColor === '#000000' ? 'brightness(0)' : 
                                    `brightness(0) invert(1) sepia(1) hue-rotate(${getHueFromHex(settings.socialIconColor)}deg) saturate(10)`;
                });
            }

            // Apply logo
            if (settings.logoUrl && settings.logoUrl !== 'attached_assets/gothslogo.png') {
                const logoEl = document.querySelector('.logo.top-logo');
                if (logoEl) {
                    logoEl.innerHTML = `<img src="${settings.logoUrl}" alt="Logo" style="max-width: 200px; max-height: 80px; object-fit: contain;">`;
                }
            }

            if (settings.activeAudio) {
                const audio = document.getElementById('background-music');
                if (audio) {
                    audio.src = settings.activeAudio;
                    audio.load(); // Reload the audio
                }
            }

            if (Array.isArray(settings.profiles)) {
                settings.profiles.forEach(profile => {
                    if (!profile.name) return;
                    const slot = profile.name.toLowerCase();
                    const card = document.querySelector(`a.profile-card[href*="${slot}.html"]`);
                    if (!card) return;
                    if (profile.url) card.href = profile.url;
                    const nameEl = card.querySelector('.profile-name');
                    if (nameEl) {
                        const textNode = [...nameEl.childNodes].find((n) => n.nodeType === Node.TEXT_NODE);
                        if (textNode) textNode.textContent = profile.name;
                    }
                    const roleEl = card.querySelector('.profile-role');
                    if (roleEl) roleEl.textContent = profile.role || 'socials';
                });
            }

            if (Array.isArray(settings.socialLinks)) {
                const cornerLinks = document.querySelectorAll('.corner-link');
                settings.socialLinks.forEach((link, idx) => {
                    const element = cornerLinks[idx];
                    if (!element) return;
                    element.href = link.url;
                    const img = element.querySelector('img');
                    if (img && link.icon) {
                        img.src = link.icon;
                    }
                    const text = element.querySelector('.location-text');
                    if (text) text.textContent = link.name;
                });
            }

            // Helper function to convert hex to rgb
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // Helper function to get hue from hex
        function getHueFromHex(hex) {
            const rgb = hexToRgb(hex);
            if (!rgb) return 0;
            const r = rgb.r / 255;
            const g = rgb.g / 255;
            const b = rgb.b / 255;
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h;
            if (max === min) {
                h = 0;
            } else if (max === r) {
                h = ((g - b) / (max - min)) % 6;
            } else if (max === g) {
                h = (b - r) / (max - min) + 2;
            } else {
                h = (r - g) / (max - min) + 4;
            }
            h *= 60;
            return h < 0 ? h + 360 : h;
        }

        loadSettings();

        // Admin check
        if (localStorage.getItem('adminToken')) {
            // Add edit button
            const editBtn = document.createElement('a');
            editBtn.href = '/customize';
            editBtn.textContent = '✏️ Edit Page';
            editBtn.style.position = 'fixed';
            editBtn.style.top = '10px';
            editBtn.style.right = '10px';
            editBtn.style.zIndex = '10000';
            editBtn.style.background = '#ff0087';
            editBtn.style.color = 'white';
            editBtn.style.border = 'none';
            editBtn.style.padding = '10px 15px';
            editBtn.style.borderRadius = '8px';
            editBtn.style.cursor = 'pointer';
            editBtn.style.fontFamily = 'Satoshi, sans-serif';
            editBtn.style.textDecoration = 'none';
            document.body.appendChild(editBtn);
        }
    </script>
