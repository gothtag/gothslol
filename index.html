    <script>
        const frame = document.querySelector('.content-frame');
        const noContextElements = document.querySelectorAll('.no-context');
        if (frame) {
            const resetFrameTransform = function() {
                frame.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
            };

            const applyFrameTransform = function(clientX, clientY) {
                const x = (clientX / window.innerWidth - 0.5) * 20;
                const y = (clientY / window.innerHeight - 0.5) * 20;
                frame.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
            };

            if (window.matchMedia('(pointer: coarse)').matches) {
                frame.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    if (touch) {
                        applyFrameTransform(touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                frame.addEventListener('touchmove', function(e) {
                    const touch = e.touches[0];
                    if (touch) {
                        applyFrameTransform(touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                frame.addEventListener('touchend', resetFrameTransform);
                frame.addEventListener('touchcancel', resetFrameTransform);
            } else {
                document.addEventListener('mousemove', function(e) {
                    applyFrameTransform(e.clientX, e.clientY);
                });

                document.addEventListener('mouseleave', resetFrameTransform);
            }
        }

        for (const element of noContextElements) {
            element.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        }

        const AVATAR_SLOTS = ['ev', 'ey'];
        const AVATAR_POLL_INTERVAL_MS = 10000;

        function avatarStorageKey(slot) {
            return `discord-avatar-url:${slot}`;
        }

        function clanBadgeStorageKey(slot) {
            return `discord-clan-badge:${slot}`;
        }

        function clanTagStorageKey(slot) {
            return `discord-clan-tag:${slot}`;
        }
        
        function avatarDecorationStorageKey(slot) {
            return `discord-avatar-decoration:${slot}`;
        }

        const DECORATION_CACHE_KEY = 'discord-decoration-cache';

        function getDecorationCacheList() {
            try {
                const raw = localStorage.getItem(DECORATION_CACHE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch (_err) {
                return [];
            }
        }

        function setDecorationCacheList(list) {
            localStorage.setItem(DECORATION_CACHE_KEY, JSON.stringify(list));
        }

        function addDecorationToCache(url) {
            if (!url) {
                return;
            }

            const list = getDecorationCacheList();
            if (list.includes(url)) {
                return;
            }

            list.unshift(url);
            if (list.length > 20) {
                list.length = 20;
            }

            setDecorationCacheList(list);
        }

        function prefetchDecorationUrls() {
            const list = getDecorationCacheList();
            for (const url of list) {
                const img = new Image();
                img.src = url;
            }
        }

        function normalizeAvatarUrl(url) {
            if (!url) {
                return '';
            }

            return String(url).split('?')[0];
        }

        function addCacheBuster(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}v=${Date.now()}`;
        }

        function hydrateCachedAvatars() {
            for (const slot of AVATAR_SLOTS) {
                const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
                if (!image) {
                    continue;
                }

                const cachedUrl = localStorage.getItem(avatarStorageKey(slot));
                if (cachedUrl) {
                    image.src = cachedUrl;
                }
            }
        }

        function hydrateCachedClanBadges() {
            for (const slot of AVATAR_SLOTS) {
                const clanBadgeEl = document.querySelector(`.clan-badge[data-discord-slot="${slot}"]`);
                if (!clanBadgeEl) {
                    continue;
                }

                const cachedBadgeUrl = localStorage.getItem(clanBadgeStorageKey(slot));
                const cachedTag = localStorage.getItem(clanTagStorageKey(slot));
                
                if (cachedBadgeUrl && cachedTag) {
                    const badgeImg = clanBadgeEl.querySelector('.clan-badge-img');
                    const badgeTag = clanBadgeEl.querySelector('.clan-tag');
                    
                    if (badgeImg && badgeTag) {
                        badgeImg.src = cachedBadgeUrl;
                        badgeImg.alt = cachedTag;
                        badgeTag.textContent = cachedTag;
                        clanBadgeEl.style.display = 'inline-flex';
                    }
                }
            }
        }
        
        function hydrateCachedAvatarDecorations() {
            for (const slot of AVATAR_SLOTS) {
                const decorationEl = document.querySelector(`.avatar-decoration[data-discord-slot="${slot}"]`);
                if (!decorationEl) {
                    continue;
                }

                const cachedDecorationUrl = localStorage.getItem(avatarDecorationStorageKey(slot));

                if (cachedDecorationUrl) {
                    const decorationImg = decorationEl.querySelector('img');
                    if (decorationImg) {
                        decorationImg.onload = function() {
                            decorationEl.style.display = 'block';
                        };
                        decorationImg.src = cachedDecorationUrl;
                    }
                    addDecorationToCache(cachedDecorationUrl);
                }
            }
        }

        async function fetchSlotData(slot, force = false) {
            try {
                const response = await fetch(`/.netlify/functions/discord-avatars?slot=${slot}${force ? '&force=1' : ''}`, {
                    cache: 'no-store'
                });

                const data = await response.json();
                return data?.[slot] || null;
            } catch (_err) {
                return null;
            }
        }

        async function syncAvatarSlot(slot, force = false, syncDecorations = true) {
            const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
            const clanBadgeEl = document.querySelector(`.clan-badge[data-discord-slot="${slot}"]`);
            const avatarDecorationEl = document.querySelector(`.avatar-decoration[data-discord-slot="${slot}"]`);
            if (!image) {
                return;
            }

            const slotData = await fetchSlotData(slot, force);
            if (!slotData || !slotData.avatarUrl) {
                return;
            }

            const avatarUrl = slotData.avatarUrl;
            const nextUrl = addCacheBuster(avatarUrl);
            const currentBase = normalizeAvatarUrl(image.src);
            const nextBase = normalizeAvatarUrl(nextUrl);
            if (currentBase === nextBase) {
                localStorage.setItem(avatarStorageKey(slot), nextUrl);
            } else {
                const preload = new Image();
                preload.onload = function() {
                    image.src = nextUrl;
                    localStorage.setItem(avatarStorageKey(slot), nextUrl);
                };
                preload.src = nextUrl;
            }

            // Sync clan badge with smart update
            if (clanBadgeEl) {
                const cachedBadgeUrl = localStorage.getItem(clanBadgeStorageKey(slot));
                const cachedTag = localStorage.getItem(clanTagStorageKey(slot));
                const newBadgeUrl = slotData.clanBadgeUrl || null;
                const newTag = slotData.clanTag || null;

                if (newBadgeUrl && newTag) {
                    const badgeImg = clanBadgeEl.querySelector('.clan-badge-img');
                    const badgeTag = clanBadgeEl.querySelector('.clan-tag');
                    
                    if (badgeImg && badgeTag) {
                        // Only update if badge URL or tag changed
                        if (cachedBadgeUrl !== newBadgeUrl || cachedTag !== newTag) {
                            badgeImg.src = newBadgeUrl;
                            badgeImg.alt = newTag;
                            badgeTag.textContent = newTag;
                            clanBadgeEl.style.display = 'inline-flex';
                        }
                        // Always update cache
                        localStorage.setItem(clanBadgeStorageKey(slot), newBadgeUrl);
                        localStorage.setItem(clanTagStorageKey(slot), newTag);
                    }
                } else if (slotData.cached && cachedBadgeUrl && cachedTag) {
                    // Keep cached badge on cached responses to avoid flicker
                    clanBadgeEl.style.display = 'inline-flex';
                } else {
                    // No clan badge - clear cache and hide
                    localStorage.removeItem(clanBadgeStorageKey(slot));
                    localStorage.removeItem(clanTagStorageKey(slot));
                    clanBadgeEl.style.display = 'none';
                }
            }
            
            // Sync avatar decoration with smart update
            if (syncDecorations && avatarDecorationEl) {
                const cachedDecorationUrl = localStorage.getItem(avatarDecorationStorageKey(slot));
                const newDecorationUrl = slotData.avatarDecorationUrl || null;

                if (newDecorationUrl) {
                    const decorationImg = avatarDecorationEl.querySelector('img');

                    if (decorationImg) {
                        if (cachedDecorationUrl === newDecorationUrl) {
                            decorationImg.onload = function() {
                                avatarDecorationEl.style.display = 'block';
                            };
                            decorationImg.src = newDecorationUrl;
                            localStorage.setItem(avatarDecorationStorageKey(slot), newDecorationUrl);
                            addDecorationToCache(newDecorationUrl);
                        } else {
                            const preload = new Image();
                            preload.onload = function() {
                                decorationImg.src = newDecorationUrl;
                                avatarDecorationEl.style.display = 'block';
                                localStorage.setItem(avatarDecorationStorageKey(slot), newDecorationUrl);
                                addDecorationToCache(newDecorationUrl);
                            };
                            preload.src = newDecorationUrl;
                        }
                    }
                } else if (slotData.cached && cachedDecorationUrl) {
                    // Keep cached decoration on cached responses to avoid flicker
                    avatarDecorationEl.style.display = 'block';
                } else {
                    // No decoration - clear cache and hide
                    localStorage.removeItem(avatarDecorationStorageKey(slot));
                    avatarDecorationEl.style.display = 'none';
                }
            }
        }

        async function syncAllAvatars(force = false, syncDecorations = true) {
            await Promise.all(AVATAR_SLOTS.map((slot) => syncAvatarSlot(slot, force, syncDecorations)));
        }

        function attachAvatarFallbacks() {
            const images = document.querySelectorAll('img[data-discord-slot]');

            for (const image of images) {
                image.addEventListener('error', function() {
                    const fallback = image.getAttribute('data-fallback-src');
                    if (!fallback) {
                        return;
                    }

                    const absoluteFallback = new URL(fallback, window.location.href).href;
                    if (image.src !== absoluteFallback) {
                        image.src = fallback;
                    }
                });
            }
        }

        attachAvatarFallbacks();
        hydrateCachedAvatars();
        hydrateCachedClanBadges();
        hydrateCachedAvatarDecorations();
        prefetchDecorationUrls();
        syncAllAvatars(true, true);

        setInterval(function() {
            if (document.visibilityState === 'visible') {
                syncAllAvatars(false, false);
            }
        }, AVATAR_POLL_INTERVAL_MS);

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                syncAllAvatars(true, false);
            }
        });

        const audio = document.getElementById('background-music');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeFill = document.getElementById('volume-fill');
        const volumeButton = document.getElementById('volume-button');
        const splashScreen = document.getElementById('splash-screen');

        if (audio && volumeSlider && volumeFill) {
            audio.volume = 1.0;

            const updateVolumeIcon = function() {
                if (audio.volume === 0 || audio.muted || audio.paused) {
                    volumeButton.classList.remove('unmuted');
                    volumeButton.classList.add('muted');
                } else {
                    volumeButton.classList.remove('muted');
                    volumeButton.classList.add('unmuted');
                }
            };

            const updateVolume = function(value) {
                const volume = value / 100;
                audio.volume = volume;
                volumeFill.style.width = value + '%';
                updateVolumeIcon();
            };

            volumeSlider.addEventListener('input', function(e) {
                updateVolume(e.target.value);
            });

            volumeButton.addEventListener('click', function(e) {
                e.stopPropagation();
                if (audio.paused) {
                    audio.play().catch(function() {});
                } else {
                    audio.pause();
                }
                updateVolumeIcon();
            });

            audio.addEventListener('play', updateVolumeIcon);
            audio.addEventListener('pause', updateVolumeIcon);
            audio.addEventListener('volumechange', updateVolumeIcon);

            updateVolumeIcon();
        }

        if (splashScreen) {
            const bgLayer = document.querySelector('.background-layer');
            if (bgLayer) {
                bgLayer.style.backgroundImage = 'none';
            }

            splashScreen.addEventListener('click', function() {
                document.body.classList.add('started');
                splashScreen.classList.add('hidden');
                if (bgLayer) {
                    bgLayer.style.backgroundImage = "url('https://r2.guns.lol/ed920f02-a70f-47a3-a7e9-726df6ca5496.gif')";
                }
                if (audio) {
                    audio.play().catch(function() {});
                }
            });
        }

    </script>
</body>
</html>
