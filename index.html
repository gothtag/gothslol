    <script>
        const frame = document.querySelector('.content-frame');
        if (frame) {
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                frame.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
            });

            document.addEventListener('mouseleave', function() {
                frame.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
            });
        }

        const AVATAR_SLOTS = ['ev', 'ey'];
        const AVATAR_POLL_INTERVAL_MS = 10000;

        function avatarStorageKey(slot) {
            return `discord-avatar-url:${slot}`;
        }

        function normalizeAvatarUrl(url) {
            if (!url) {
                return '';
            }

            return String(url).split('?')[0];
        }

        function addCacheBuster(url) {
            const separator = url.includes('?') ? '&' : '?';
            return `${url}${separator}v=${Date.now()}`;
        }

        function hydrateCachedAvatars() {
            for (const slot of AVATAR_SLOTS) {
                const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
                if (!image) {
                    continue;
                }

                const cachedUrl = localStorage.getItem(avatarStorageKey(slot));
                if (cachedUrl) {
                    image.src = cachedUrl;
                }
            }
        }

        async function fetchSlotAvatarUrl(slot, force = false) {
            try {
                const response = await fetch(`/.netlify/functions/discord-avatars?slot=${slot}${force ? '&force=1' : ''}`, {
                    cache: 'no-store'
                });

                const data = await response.json();
                return data?.[slot]?.avatarUrl || null;
            } catch (_err) {
                return null;
            }
        }

        async function syncAvatarSlot(slot, force = false) {
            const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
            if (!image) {
                return;
            }

            const avatarUrl = await fetchSlotAvatarUrl(slot, force);
            if (!avatarUrl) {
                return;
            }

            const nextUrl = addCacheBuster(avatarUrl);
            const currentBase = normalizeAvatarUrl(image.src);
            const nextBase = normalizeAvatarUrl(nextUrl);
            if (currentBase === nextBase) {
                localStorage.setItem(avatarStorageKey(slot), nextUrl);
                return;
            }

            const preload = new Image();
            preload.onload = function() {
                image.src = nextUrl;
                localStorage.setItem(avatarStorageKey(slot), nextUrl);
            };
            preload.src = nextUrl;
        }

        async function syncAllAvatars(force = false) {
            await Promise.all(AVATAR_SLOTS.map((slot) => syncAvatarSlot(slot, force)));
        }

        function attachAvatarFallbacks() {
            const images = document.querySelectorAll('img[data-discord-slot]');

            for (const image of images) {
                image.addEventListener('error', function() {
                    const fallback = image.getAttribute('data-fallback-src');
                    if (!fallback) {
                        return;
                    }

                    const absoluteFallback = new URL(fallback, window.location.href).href;
                    if (image.src !== absoluteFallback) {
                        image.src = fallback;
                    }
                });
            }
        }

        attachAvatarFallbacks();
        hydrateCachedAvatars();
        syncAllAvatars(true);

        setInterval(function() {
            if (document.visibilityState === 'visible') {
                syncAllAvatars(false);
            }
        }, AVATAR_POLL_INTERVAL_MS);

        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                syncAllAvatars(true);
            }
        });

    </script>
