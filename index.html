        html {

        body {
            margin: 0;
            padding: 0;
            background: #000000;
            color: white;

        .background-layer {
            position: fixed;
            inset: 0;

            height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            z-index: 0;

            background: #000000 url('https://r2.guns.lol/ed920f02-a70f-47a3-a7e9-726df6ca5496.gif') no-repeat center center;
            background-size: cover;
            transform: translateZ(0);
        }

        .texture {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            z-index: 1;
            opacity: 0.18;
            pointer-events: none;
            background: transparent url(https://assets.guns.lol/guns_dot.png) repeat 0 0;
        }

        .content-frame {
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2) url(https://assets.guns.lol/guns_dot.png) repeat;
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            filter: brightness(1.1);
            max-width: 700px;
            width: 100%;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .logo {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: black;
            font-family: 'Roboto', sans-serif;
            animation: glow 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 10px rgba(0, 0, 0, 0.4));
            text-transform: lowercase;
            letter-spacing: 2px;
            text-align: center;
            will-change: transform, filter;
            transform: translate3d(0, 0, 0);
            cursor: url('attached_assets/cursor3.png') 8 8, pointer;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.4)) drop-shadow(0 0 10px rgba(0, 0, 0, 0.4));
            }
            to {
                filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 15px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 20px rgba(0, 0, 0, 0.5));
            }
        }

        .links {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            position: relative;
            text-align: center;
            transition: all 0.3s ease;
            cursor: url('attached_assets/cursor3.png') 8 8, pointer;
            text-decoration: none;
            color: white;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-gradient-ring {
            position: absolute;
            width: 110px;
            height: 110px;
            background: conic-gradient(from 0deg, #707070 0%, #707070 35%, #1a1a1a 50%, #707070 65%, #707070 100%);
            border-radius: 50%;
            animation: rotateGradient 3s linear infinite;
            z-index: 5;
        }

        @keyframes rotateGradient {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            z-index: 10;
            background: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .avatar img[data-discord-slot] {
            opacity: 0;
        }

        .avatar img.avatar-ready {
            opacity: 1;
        }

        .avatar img.is-swapping {
            opacity: 0;
        }

        .avatar:hover .avatar-overlay {
            opacity: 1;
        }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-overlay span {
            color: white;
            font-size: 1.2rem;
        }

        .profile-name {
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Chillax', sans-serif !important;
            font-size: 1.2rem;
            font-weight: 500;

<body>
    <div class="background-layer"></div>
    <div class="texture"></div>
    <div class="content-frame">
        <div class="logo">goths<span>.</span>lol</div>
        <div class="links">
            <a href="ev.html" class="profile-card">
                <div class="avatar-container">
                    <div class="avatar-gradient-ring"></div>
                    <div class="avatar">
                        <img src="attached_assets/985e453463ba0af44c2e2df2bcca2fe9.jpg" alt="@ev" data-discord-slot="ev">
                        <div class="avatar-overlay">
                            <span>➜]</span>
                        </div>
                    </div>
                </div>
                <div class="profile-name">ev</div>
                <div class="profile-role">socials</div>
            </a>
            <a href="ey.html" class="profile-card">
                <div class="avatar-container">
                    <div class="avatar-gradient-ring"></div>
                    <div class="avatar">
                        <img src="attached_assets/cce169f5e720f9a062dcf82f3934cd12.jpg" alt="@ey" data-discord-slot="ey">
                        <div class="avatar-overlay">
                            <span>➜]</span>
                        </div>
                    </div>
                </div>
                <div class="profile-name">ey</div>
                <div class="profile-role">socials</div>
            </a>
        </div>
    </div>

    <script>
        const frame = document.querySelector('.content-frame');
        if (frame) {
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                frame.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
            });

            document.addEventListener('mouseleave', function() {
                frame.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
            });
        }

        function setAvatarSource(image, nextUrl, options = {}) {
            const { smooth = true } = options;

            if (!image || !nextUrl) {
                return;
            }

            const currentSrc = image.getAttribute('src') || '';
            const normalizedCurrent = currentSrc.split('?')[0];
            const normalizedNext = nextUrl.split('?')[0];

            if (normalizedCurrent === normalizedNext) {
                return;
            }

            const preload = new Image();
            preload.onload = () => {
                if (smooth) {
                    image.classList.add('is-swapping');
                    setTimeout(() => {
                        image.src = nextUrl;
                        image.classList.add('avatar-ready');
                        requestAnimationFrame(() => {
                            image.classList.remove('is-swapping');
                        });
                    }, 100);
                } else {
                    image.src = nextUrl;
                    image.classList.add('avatar-ready');
                }
            };
            preload.src = nextUrl;
        }

        async function refreshDiscordAvatars() {
            try {
                const response = await fetch('/.netlify/functions/discord-avatars', {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                const slots = ['ev', 'ey'];

                for (const slot of slots) {
                    const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
                    if (!image) {
                        continue;
                    }

                    const avatarUrl = data?.[slot]?.avatarUrl;
                    if (!avatarUrl) {
                        image.classList.add('avatar-ready');
                        continue;
                    }

                    const separator = avatarUrl.includes('?') ? '&' : '?';
                    const finalUrl = `${avatarUrl}${separator}_=${Date.now()}`;
                    setAvatarSource(image, finalUrl, { smooth: false });
                }
            } catch (_err) {
                const slots = ['ev', 'ey'];
                for (const slot of slots) {
                    const image = document.querySelector(`img[data-discord-slot="${slot}"]`);
                    if (image) {
                        image.classList.add('avatar-ready');
                    }
                }
            }
        }

        refreshDiscordAvatars();
    </script>
