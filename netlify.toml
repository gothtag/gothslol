[build]
  publish = "."
  command = "echo 'No build step'"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/customize"
  to = "/customize.html"
  status = 200

[[redirects]]
  from = "/links"
  to = "/links.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200