<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GothSlol - Liens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Onest', sans-serif;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* SIDEBAR - GUNS.LOL STYLE */
        .sidebar {
            width: 280px;
            background: rgba(20, 20, 20, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            text-decoration: none;
            color: #fff;
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background-image: url('https://assets.guns.lol/guns_logo_no_background_cropped.png');
            background-size: cover;
            background-position: center;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 5px;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(124, 58, 237, 0.2);
            color: #c4b5fd;
        }

        .nav-icon {
            font-size: 16px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
        }
            text-align: center;
        }

        /* MAIN CONTENT */
        .main-content {
            margin-left: 280px;
            width: calc(100% - 280px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .bio {
            font-size: 14px;
            color: #999;
            margin-bottom: 5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
        }

        .link-card:hover {
            background: rgba(20, 20, 20, 0.9);
            border-color: rgba(124, 58, 237, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.15);
        }

        .link-icon {
            width: 40px;
            height: 40px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .link-info {
            flex: 1;
        }

        .link-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .link-description {
            font-size: 12px;
            color: #888;
        }

        .link-arrow {
            color: #666;
            font-size: 18px;
        }

        .admin-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-button {
            width: 100%;
            padding: 12px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.4);
            color: #c4b5fd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .admin-button:hover {
            background: rgba(124, 58, 237, 0.3);
            transform: translateY(-2px);
        }

        .admin-button.danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .admin-button.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Scrollbar styling */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(196, 181, 253, 0.2);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(196, 181, 253, 0.4);
        }

        /* Profile Section */
        .profile-section {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-details {
            flex: 1;
        }

        .profile-name {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .profile-uid {
            color: #888;
            font-size: 12px;
        }

        .profile-menu {
            display: flex;
            gap: 8px;
        }

        .profile-menu-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .profile-menu-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 480px) {
            .title {
                font-size: 24px;
            }

            .logo {
                font-size: 40px;
            }

            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 200px;
                width: calc(100% - 200px);
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <a href="/" class="sidebar-header">
            <div class="sidebar-logo"></div>
            <div class="sidebar-title">GothSlol</div>
        </a>

        <div class="nav-section">
            <div class="nav-section-title">Compte</div>
            <a href="/customize" class="nav-item">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M5 19h1.425L16.2 9.225L14.775 7.8L5 17.575zm-2 2v-4.25L16.2 3.575q.3-.275.663-.425t.762-.15q.4 0 .775.15t.65.45L20.425 5q.3.275.438.65T21 6.4q0 .4-.137.763t-.438.662L7.25 21zM19 6.4L17.6 5zm-3.525 2.125l-.7-.725L16.2 9.225z"/>
                    </svg>
                </span>
                Personnaliser
            </a>
            <a href="/links" class="nav-item active">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 256 256">
                        <path fill="currentColor" d="M136.37 187.53a12 12 0 0 1 0 17l-5.94 5.94a60 60 0 0 1-84.88-84.88l24.12-24.11A60 60 0 0 1 152 99a12 12 0 1 1-16 18a36 36 0 0 0-49.37 1.47l-24.1 24.08a36 36 0 0 0 50.92 50.92l5.94-5.94a12 12 0 0 1 16.98 0m74.08-142a60.09 60.09 0 0 0-84.88 0l-5.94 5.94a12 12 0 0 0 17 17l5.94-5.94a36 36 0 0 1 50.92 50.92l-24.11 24.12A36 36 0 0 1 120 139a12 12 0 0 0-16 18a60 60 0 0 0 82.3-2.43l24.12-24.11a60.09 60.09 0 0 0 .03-84.91Z"/>
                    </svg>
                </span>
                Liens
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Pages</div>
            <a href="/" class="nav-item">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M11 6a1 1 0 1 1 0 2H5v11h11v-6a1 1 0 1 1 2 0v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm9-3a1 1 0 0 1 1 1v5a1 1 0 1 1-2 0V6.414l-8.293 8.293a1 1 0 0 1-1.414-1.414L17.586 5H15a1 1 0 1 1 0-2Z"/>
                    </svg>
                </span>
                Voir ma page
            </a>
        </div>

        <div class="nav-section" id="adminNav" style="display: none;">
            <div class="nav-section-title">Actions</div>
            <a class="nav-item" onclick="logout()" style="cursor: pointer;">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                </span>
                Déconnexion
            </a>
        </div>

        <!-- Profile Section -->
        <div class="profile-section" id="profileSection" style="display: none;">
            <div class="profile-info">
                <img src="https://cdn.discordapp.com/avatars/469780875584733195/41eba6554858ac14cbbd4cac9e984c08.webp" alt="Admin Avatar" class="profile-avatar">
                <div class="profile-details">
                    <div class="profile-name">ev & ey</div>
                    <div class="profile-uid">UID 1</div>
                </div>
            </div>
            <div class="profile-menu">
                <button class="profile-menu-btn" title="Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M6 10.5a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3m4.5 1.5a1.5 1.5 0 1 1 3 0a1.5 1.5 0 0 1-3 0m6 0a1.5 1.5 0 1 1 3 0a1.5 1.5 0 0 1-3 0"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <div class="logo" id="logo">👻</div>
                <h1 class="title" id="siteName">GOTH</h1>
                <p class="bio" id="siteBio">Mes liens personnels</p>
            </div>

            <!-- Links -->
            <div class="links-container" id="linksContainer">
                <!-- Links will be added dynamically -->
            </div>

            <!-- Admin Section -->
            <div class="admin-section" id="adminSection" style="display: none;">
                <button class="admin-button" onclick="goToCustomize()">⚙️ Modifier la page</button>
                <button class="admin-button danger" onclick="logout()">🚪 Déconnexion</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');

        // Check if logged in
        function isLoggedIn() {
            return !!token;
        }

        // Load and display settings
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('pageSettings')) || {
                logo: '👻',
                name: 'GOTH',
                bio: 'Mes liens personnels',
                primaryColor: '#7c3aed'
            };
            
            document.getElementById('logo').textContent = settings.logo || '👻';
            document.getElementById('siteName').textContent = settings.name || 'GOTH';
            document.getElementById('siteBio').textContent = settings.bio || 'Mes liens personnels';
        }

        // Load links (placeholder)
        function loadLinks() {
            const links = JSON.parse(localStorage.getItem('pageLinks') || '[]');
            const container = document.getElementById('linksContainer');
            
            if (links.length === 0) {
                // Default links
                container.innerHTML = `
                    <a href="https://twitter.com" class="link-card" target="_blank">
                        <div class="link-icon">𝕏</div>
                        <div class="link-info">
                            <div class="link-title">Twitter / X</div>
                            <div class="link-description">Suivez-moi en ligne</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                    <a href="https://discord.gg" class="link-card" target="_blank">
                        <div class="link-icon">💜</div>
                        <div class="link-info">
                            <div class="link-title">Serveur Discord</div>
                            <div class="link-description">Rejoignez la communauté</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                    <a href="https://twitch.tv" class="link-card" target="_blank">
                        <div class="link-icon">▶️</div>
                        <div class="link-info">
                            <div class="link-title">En direct</div>
                            <div class="link-description">Regardez sur Twitch</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                `;
            } else {
                container.innerHTML = links.map(link => `
                    <a href="${link.url}" class="link-card" target="_blank">
                        <div class="link-icon">${link.icon}</div>
                        <div class="link-info">
                            <div class="link-title">${link.title}</div>
                            <div class="link-description">${link.description}</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                `).join('');
            }
        }

        // Show admin section and navigation if logged in
        function showAdmin() {
            if (isLoggedIn()) {
                document.getElementById('adminSection').style.display = 'flex';
                document.getElementById('adminNav').style.display = 'block';
                document.getElementById('profileSection').style.display = 'block';
            }
        }

        // Go to customize
        function goToCustomize() {
            window.location.href = '/customize';
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('pageSettings');
            window.location.href = '/login';
        }

        // Initialize
        loadSettings();
        loadLinks();
        showAdmin();
    </script>
</body>
</html>
