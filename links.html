                    </a>
                    <a href="https://twitch.tv" class="link-card" target="_blank">
                        <div class="link-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg></div>
                        <div class="link-info">
                            <div class="link-title">En direct</div>
                            <div class="link-description">Regardez sur Twitch</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                `;
            } else {
                container.innerHTML = links.map(link => `
                    <a href="${link.url}" class="link-card" target="_blank">
                        <div class="link-icon">${link.icon}</div>
                        <div class="link-info">
                            <div class="link-title">${link.title}</div>
                            <div class="link-description">${link.description}</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                `).join('');
            }
        }

        // Show admin section and navigation if logged in
        function showAdmin() {
            // Temporarily show profile for testing
            document.getElementById('adminSection').style.display = 'flex';
            document.getElementById('adminNav').style.display = 'block';
            document.getElementById('profileSection').style.display = 'block';
            /*
            if (isLoggedIn()) {
                document.getElementById('adminSection').style.display = 'flex';
                document.getElementById('adminNav').style.display = 'block';
                document.getElementById('profileSection').style.display = 'block';
            }
            */
        }

        // Go to customize
        function goToCustomize() {
            window.location.href = '/customize';
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('pageSettings');
            window.location.href = '/login';
        }

        // Initialize
        loadSettings();
        loadLinks();
        showAdmin();

        // Profile dropdown menu toggle
        const profileMenuBtn = document.getElementById('profileMenuBtn');
        const profileDropdown = document.getElementById('profileDropdown');

        if (profileMenuBtn && profileDropdown) {
            profileMenuBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                profileDropdown.classList.toggle('active');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', function(e) {
                if (!profileMenuBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                    profileDropdown.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
