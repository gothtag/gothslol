<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GothSlol - Your Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Onest', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .bio {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-card {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
        }

        .link-card:hover {
            background: rgba(20, 20, 20, 1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.2);
        }

        .link-icon {
            width: 40px;
            height: 40px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .link-info {
            flex: 1;
        }

        .link-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .link-description {
            font-size: 12px;
            color: #888;
        }

        .link-arrow {
            color: #666;
            font-size: 18px;
        }

        .admin-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .admin-button {
            width: 100%;
            padding: 12px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.4);
            color: #c4b5fd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .admin-button:hover {
            background: rgba(124, 58, 237, 0.3);
            transform: translateY(-2px);
        }

        .admin-button.danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .admin-button.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 480px) {
            .title {
                font-size: 24px;
            }

            .logo {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo" id="logo">👻</div>
            <h1 class="title" id="siteName">GOTH</h1>
            <p class="bio" id="siteBio">My personal links</p>
        </div>

        <!-- Links -->
        <div class="links-container" id="linksContainer">
            <!-- Links will be added here dynamically -->
            <a href="#" class="link-card">
                <div class="link-icon">🔗</div>
                <div class="link-info">
                    <div class="link-title">My Website</div>
                    <div class="link-description">Check out my main site</div>
                </div>
                <div class="link-arrow">→</div>
            </a>
        </div>

        <!-- Admin Section -->
        <div class="admin-section" id="adminSection" style="display: none;">
            <button class="admin-button" onclick="goToCustomize()">⚙️ Edit Page</button>
            <button class="admin-button danger" onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <script>
        // Check if logged in
        function isLoggedIn() {
            return !!localStorage.getItem('adminToken');
        }

        // Load and display settings
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('gothSlolSettings') || '{}');
            
            document.getElementById('logo').textContent = settings.logoEmoji || '👻';
            document.getElementById('siteName').textContent = settings.logoText || 'GOTH';
            document.getElementById('siteBio').textContent = settings.bioText || 'My personal links';

            // Apply colors
            if (settings.primaryColor) {
                document.documentElement.style.setProperty('--primary', settings.primaryColor);
            }
        }

        // Load links (placeholder - would come from database)
        function loadLinks() {
            const links = JSON.parse(localStorage.getItem('gothSlolLinks') || '[]');
            const container = document.getElementById('linksContainer');
            
            if (links.length === 0) {
                // Default links if none set
                container.innerHTML = `
                    <a href="https://twitter.com" class="link-card" target="_blank">
                        <div class="link-icon">𝕏</div>
                        <div class="link-info">
                            <div class="link-title">Twitter / X</div>
                            <div class="link-description">Follow me on social</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                    <a href="https://discord.gg" class="link-card" target="_blank">
                        <div class="link-icon">💜</div>
                        <div class="link-info">
                            <div class="link-title">Discord Server</div>
                            <div class="link-description">Join our community</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                    <a href="https://twitch.tv" class="link-card" target="_blank">
                        <div class="link-icon">▶️</div>
                        <div class="link-info">
                            <div class="link-title">Stream</div>
                            <div class="link-description">Watch live on Twitch</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                `;
            } else {
                container.innerHTML = links.map(link => `
                    <a href="${link.url}" class="link-card" target="_blank">
                        <div class="link-icon">${link.icon}</div>
                        <div class="link-info">
                            <div class="link-title">${link.title}</div>
                            <div class="link-description">${link.description}</div>
                        </div>
                        <div class="link-arrow">→</div>
                    </a>
                `).join('');
            }
        }

        // Show admin section if logged in
        function showAdminSection() {
            if (isLoggedIn()) {
                document.getElementById('adminSection').style.display = 'block';
            }
        }

        // Go to customize page
        function goToCustomize() {
            window.location.href = '/customize.html';
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('gothSlolSettings');
            window.location.reload();
        }

        // Initialize
        loadSettings();
        loadLinks();
        showAdminSection();
    </script>
</body>
</html>
