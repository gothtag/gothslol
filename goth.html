    <script>
        const frame = document.querySelector('.content-container');
        const noContextElements = document.querySelectorAll('.no-context');
        
        if (frame) {
            const resetFrameTransform = function() {
                frame.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1)';
            };

            const applyFrameTransform = function(clientX, clientY) {
                const x = (clientX / window.innerWidth - 0.5) * 20;
                const y = (clientY / window.innerHeight - 0.5) * 20;
                frame.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
            };

            if (window.matchMedia('(pointer: coarse)').matches) {
                frame.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    if (touch) {
                        applyFrameTransform(touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                frame.addEventListener('touchmove', function(e) {
                    const touch = e.touches[0];
                    if (touch) {
                        applyFrameTransform(touch.clientX, touch.clientY);
                    }
                }, { passive: true });

                frame.addEventListener('touchend', resetFrameTransform);
                frame.addEventListener('touchcancel', resetFrameTransform);
            } else {
                document.addEventListener('mousemove', function(e) {
                    applyFrameTransform(e.clientX, e.clientY);
                });

                document.addEventListener('mouseleave', resetFrameTransform);
            }
        }

        for (const element of noContextElements) {
            element.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });
        }

        const GUILD_ID = "1369700887018344458";

        // Cache management
        function normalizeUrl(url) {
            if (!url) return '';
            return String(url).split('?')[0];
        }

        function getCachedBannerUrl() {
            return localStorage.getItem('guild-banner-url');
        }

        function setCachedBannerUrl(url) {
            localStorage.setItem('guild-banner-url', url);
        }

        function getCachedAvatarUrl() {
            return localStorage.getItem('guild-avatar-url');
        }

        function setCachedAvatarUrl(url) {
            localStorage.setItem('guild-avatar-url', url);
        }

        async function loadGuildInfo() {
            try {
                console.log('Loading guild info for ID:', GUILD_ID);
                const response = await fetch(`/.netlify/functions/discord-guild?id=${GUILD_ID}`);
                console.log('API response status:', response.status);
                
                const guildInfo = await response.json();
                console.log('Guild info received:', guildInfo);
                
                if (guildInfo && !guildInfo.error) {
                    // Update banner with cache
                    if (guildInfo.banner_url) {
                        const cachedBanner = getCachedBannerUrl();
                        const bannerEl = document.getElementById('guild-banner');
                        
                        if (normalizeUrl(cachedBanner) === normalizeUrl(guildInfo.banner_url)) {
                            // Same banner, use cached version
                            bannerEl.src = cachedBanner;
                        } else {
                            // Different banner, preload and update
                            const preload = new Image();
                            preload.onload = function() {
                                bannerEl.src = guildInfo.banner_url;
                                setCachedBannerUrl(guildInfo.banner_url);
                            };
                            preload.src = guildInfo.banner_url;
                        }
                    }
                    
                    // Update guild name
                    const guildName = guildInfo.name || 'gothtag';
                    console.log('Setting guild name:', guildName);
                    document.getElementById('guild-name').textContent = guildName;
                    
                    // Update guild description
                    if (guildInfo.description) {
                        document.getElementById('guild-description').textContent = guildInfo.description;
                    }
                    
                    // Update guild clan badge and tag (with fallback to vanity URL)
                    const hasClan = guildInfo.clan_badge && guildInfo.clan_tag;
                    const hasVanity = guildInfo.vanity_url_code;
                    
                    if (hasClan || hasVanity) {
                        const guildTagEl = document.getElementById('guild-tag');
                        if (guildTagEl) {
                            guildTagEl.innerHTML = '';
                            
                            if (hasClan) {
                                // Real clan badge
                                const badgeImg = document.createElement('img');
                                badgeImg.className = 'clan-badge-img';
                                badgeImg.src = guildInfo.clan_badge;
                                badgeImg.alt = guildInfo.clan_tag;
                                
                                const tagText = document.createElement('span');
                                tagText.className = 'clan-tag';
                                tagText.textContent = guildInfo.clan_tag;
                                
                                guildTagEl.appendChild(badgeImg);
                                guildTagEl.appendChild(tagText);
                            } else {
                                // Fallback to vanity URL as tag
                                const tagText = document.createElement('span');
                                tagText.className = 'clan-tag';
                                tagText.textContent = guildInfo.vanity_url_code.toUpperCase();
                                
                                guildTagEl.appendChild(tagText);
                            }
                            
                            guildTagEl.style.display = 'inline-flex';
                        }
                    }
                    
                    // Update avatar with cache
                    if (guildInfo.icon_url) {
                        const cachedAvatar = getCachedAvatarUrl();
                        const avatarEl = document.getElementById('guild-avatar');
                        
                        if (normalizeUrl(cachedAvatar) === normalizeUrl(guildInfo.icon_url)) {
                            // Same avatar, use cached version
                            avatarEl.src = cachedAvatar;
                        } else {
                            // Different avatar, preload and update
                            const preload = new Image();
                            preload.onload = function() {
                                avatarEl.src = guildInfo.icon_url;
                                setCachedAvatarUrl(guildInfo.icon_url);
                            };
                            preload.src = guildInfo.icon_url;
                        }
                    }
                    
                    // Display member counts
                    console.log('Member count:', guildInfo.approximate_member_count);
                    console.log('Online count:', guildInfo.approximate_presence_count);
                    if (guildInfo.approximate_member_count !== undefined) {
                        document.getElementById('member-count').textContent = guildInfo.approximate_member_count.toLocaleString();
                    }
                    if (guildInfo.approximate_presence_count !== undefined) {
                        document.getElementById('online-count').textContent = guildInfo.approximate_presence_count.toLocaleString();
                    }
                } else {
                    console.error('Guild info error:', guildInfo?.error || 'Unknown error');
                }
            } catch (_err) {
                console.error("Error loading guild info:", _err);
            }
        }

        // Hydrate cached images on load
        const cachedBanner = getCachedBannerUrl();
        const cachedAvatar = getCachedAvatarUrl();
        
        if (cachedBanner) {
            document.getElementById('guild-banner').src = cachedBanner;
        }
        if (cachedAvatar) {
            document.getElementById('guild-avatar').src = cachedAvatar;
        }

        loadGuildInfo();

        const audio = document.getElementById('background-music');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeFill = document.getElementById('volume-fill');
        const volumeButton = document.getElementById('volume-button');
        const volumeControl = document.querySelector('.volume-control');
        const splashScreen = document.getElementById('splash-screen');
        const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;

        if (audio && volumeSlider && volumeFill) {
            audio.volume = 1.0;

            const updateVolumeIcon = function() {
                if (audio.volume === 0 || audio.muted || audio.paused) {
                    volumeButton.classList.remove('unmuted');
                    volumeButton.classList.add('muted');
                } else {
                    volumeButton.classList.remove('muted');
                    volumeButton.classList.add('unmuted');
                }
            };

            const updateVolume = function(value) {
                const volume = value / 100;
                audio.volume = volume;
                volumeFill.style.width = value + '%';
                updateVolumeIcon();
            };

            volumeSlider.addEventListener('input', function(e) {
                updateVolume(e.target.value);
            });

            volumeButton.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isCoarsePointer && volumeControl) {
                    volumeControl.classList.add('open');
                }
                if (audio.paused) {
                    audio.play().catch(function() {});
                } else {
                    audio.pause();
                }
                updateVolumeIcon();
            });

            audio.addEventListener('play', updateVolumeIcon);
            audio.addEventListener('pause', updateVolumeIcon);
            audio.addEventListener('volumechange', updateVolumeIcon);

            updateVolumeIcon();

            if (isCoarsePointer && volumeControl) {
                volumeSlider.addEventListener('pointerdown', function(e) {
                    e.stopPropagation();
                    volumeControl.classList.add('open');
                });

                volumeControl.addEventListener('click', function(e) {
                    e.stopPropagation();
                    volumeControl.classList.add('open');
                });

                document.addEventListener('click', function(e) {
                    if (!volumeControl.contains(e.target)) {
                        volumeControl.classList.remove('open');
                    }
                });
            }
        }

        if (splashScreen) {
            const bgVideo = document.getElementById('background-video');
            if (bgVideo) {
                bgVideo.pause();
            }

            splashScreen.addEventListener('click', function() {
                document.body.classList.add('started');
                splashScreen.classList.add('hidden');
                if (bgVideo) {
                    bgVideo.play().catch(function() {});
                }
                if (audio) {
                    audio.play().catch(function() {});
                }
            });
        }

    </script>
